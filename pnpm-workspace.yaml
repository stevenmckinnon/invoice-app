allowBuilds:
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  # Patched versions of transitive dependencies with known vulnerabilities
  # (pnpm audit / Snyk). Each stays within the major its parent asks for, except
  # where only a newer major is patched. Drop an entry once its parent catches up.
  dompurify: ^3.4.17
  zod: ^4.6.7
  source-map-js: ^1.2.2
  fast-uri: ^3.1.9
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.2
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  linkify-it: ^5.0.2
  katex: ^0.18.2
  glob@13: ^14.0.2
  minimatch@10: ^11.0.1
  ip-address: ^10.7.4
  systeminformation: ^5.33.16
  undici: ^7.30.1
